syntax = "proto3";

// This file defines Plane, the fabric plane an endpoint is admitted to.
package idyl.common.v2;

option go_package = "github.com/idyl-labs/hyperplane-go/wire/commonv2";

// Plane identifies a fabric plane. A zone runs a control plane and a data
// plane as separate fabric instances. An admission lease names exactly one
// plane and binds only to a connection made on that plane.
enum Plane {
  PLANE_UNSPECIFIED = 0;
  PLANE_CONTROL = 1;
  PLANE_DATA = 2;
}
