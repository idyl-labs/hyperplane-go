name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "stable"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      # The race detector needs cgo and a C toolchain. Windows runs the same
      # tests without it, so the job does not depend on the runner's compiler.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            GOWORK=off go test ./...
          else
            GOWORK=off go test -race ./...
          fi

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest patch release, so vulnerability checks see a current
          # standard library.
          go-version: "1.26.x"
      - name: Tidy
        run: make tidy-check
      - name: Dependency direction
        run: make deps-check
      - name: License headers
        run: make license-check
      - name: Lint
        run: make lint
      - name: Generated code is current
        run: make proto-check
      - name: Vulnerabilities
        run: make vuln
      - name: Coverage
        run: make cover

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Fuzz every decoder
        run: make fuzz FUZZTIME=20s

  protocol:
    name: Protocol compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest patch release, so vulnerability checks see a current
          # standard library.
          go-version: "1.26.x"
      # A change that breaks the wire contract against the base branch fails
      # here and needs a new protocol version instead.
      - name: Breaking changes
        run: GOWORK=off go run github.com/bufbuild/buf/cmd/buf@v1.70.0 breaking wire --against ".git#ref=origin/${{ github.base_ref }},subdir=wire"
